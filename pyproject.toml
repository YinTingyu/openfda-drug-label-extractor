# pyproject.toml
[project]
name = "drug-label-extractor"
version = "0.1.0"
description = "Extract drug information from OpenFDA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
drug-label-extractor = "drug_label_extractor:main"

[tool.uv.build-backend]
module-name = "extractor"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
markers = ["llm: tests that call a real LLM API (slow, costs money)"]
addopts = "-m 'not llm'"        # 默认不跑

